<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="杨博文的一些思考，目前为感悟碎碎念。">
  <title>一些思考 · 杨博文</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='none' stroke='%23c9a66b' stroke-width='1.5'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='system-ui,sans-serif' fill='%23c9a66b'%3E%E6%9D%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/articles.css">
</head>
<body>
  <main class="page wrap" id="articles">
    <nav class="nav-links" aria-label="页面导航">
      <a href="../">返回名片</a>
    </nav>
    <h1 class="page-title">一些思考</h1>
    <ul class="filters" aria-label="文章主题">
      <li><a href="./" data-filter="notes">感悟碎碎念</a></li>
      <li><span aria-disabled="true" title="施工中 1" aria-label="施工中 1">施工中</span></li>
      <li><span aria-disabled="true" title="施工中 2" aria-label="施工中 2">施工中</span></li>
      <li><span aria-disabled="true" title="施工中 3" aria-label="施工中 3">施工中</span></li>
    </ul>
    <div id="article-index">
      <p class="empty">尚未发布。</p>
    </div>
  </main>
  <script src="data.js"></script>
  <script>
(function () {
  var data = window.ARTICLES || { categories: [], articles: [] };
  var articles = Array.isArray(data.articles) ? data.articles : [];
  var categories = Array.isArray(data.categories) ? data.categories : [];
  var labels = {};
  var enabled = [];
  categories.forEach(function (c) {
    labels[c.id] = c.label;
    if (c && c.id && !c.disabled) enabled.push(c);
  });
  var defaultId = enabled.length ? enabled[0].id : "";

  var params = new URLSearchParams(location.search);
  var current = params.get("c") || defaultId;
  var allowed = {};
  enabled.forEach(function (c) { allowed[c.id] = true; });
  if (!allowed[current]) current = defaultId;

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var nav = document.querySelector(".filters");
  if (nav && categories.length) {
    var html = "";
    var wip = 0;
    categories.forEach(function (c) {
      if (c.disabled) {
        wip += 1;
        var dist = "施工中 " + wip;
        html += '<li><span aria-disabled="true" title="' + escapeHtml(dist) + '" aria-label="' + escapeHtml(dist) + '">' + escapeHtml(c.label || "施工中") + "</span></li>";
      } else {
        var href = c.id === defaultId ? "./" : ("?c=" + encodeURIComponent(c.id));
        html += '<li><a href="' + href + '" data-filter="' + escapeHtml(c.id) + '"';
        if (c.id === current) html += ' aria-current="page"';
        html += ">" + escapeHtml(c.label) + "</a></li>";
      }
    });
    nav.innerHTML = html;
  } else {
    document.querySelectorAll(".filters a").forEach(function (a) {
      var id = a.getAttribute("data-filter");
      if (id === current) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(iso || "");
    if (!m) return "";
    return "· " + Number(m[1]) + "/" + Number(m[2]) + "/" + Number(m[3]);
  }

  var visible = articles.filter(function (item) {
    if (!item || !item.slug || !item.title) return false;
    return item.category === current;
  });

  var root = document.getElementById("article-index");
  if (!root) return;
  if (visible.length === 0) {
    root.innerHTML = '<p class="empty">尚未发布。</p>';
    return;
  }

  var list = '<ul class="article-list">';
  visible.forEach(function (item) {
    var href = encodeURI(item.slug) + ".html";
    var date = formatDate(item.date);
    var cat = labels[item.category] || "";
    var meta = [date, cat].filter(Boolean).join("  ");
    list += '<li class="article-item">';
    list += '<h2><a href="' + href + '">' + escapeHtml(item.title) + "</a></h2>";
    if (meta) list += '<p class="article-meta">' + escapeHtml(meta) + "</p>";
    if (item.summary) list += '<p class="article-summary">' + escapeHtml(item.summary) + "</p>";
    list += "</li>";
  });
  list += "</ul>";
  root.innerHTML = list;
})();
  </script>
</body>
</html>
